[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cape"
version = "1.0.0"
description = "CAPE: a modular cybersecurity assessment framework for authorized security testing, explainability, and auditability"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "CAPE Project"}
]
keywords = ["security", "penetration-testing", "cybersecurity", "assessment", "auditability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "typer[all]>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "prompt_toolkit>=3.0",
    "xmltodict>=0.13",
    "jinja2>=3.1",
    "networkx>=3.2",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "click>=8.1",
    "weasyprint>=61",
    "google-genai>=0.3",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9",
]
graphviz = [
    "graphviz>=0.20",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "factory-boy>=3.3",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.8",
    "ruff>=0.3",
]

[project.scripts]
cape = "cape.cli.main:entry_point"

[project.urls]
"Source Code" = "https://github.com/aswins069/CAPE-Cybersecurity-Assessment-Framework-Attacks"
"Bug Tracker" = "https://github.com/aswins069/CAPE-Cybersecurity-Assessment-Framework-Attacks/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cape*"]

[tool.setuptools.package-data]
"*" = [
    "scan/profiles/*.yaml",
    "plan/workflows/*.yaml",
    "show/knowledge/*.json",
    "show/knowledge/*.yaml",
    "show/compliance/*.yaml",
    "reports/templates/*.j2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (require tools installed)",
    "slow: marks tests as slow",
]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["cape"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT"]
ignore = ["E501", "B008", "A003"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "db/migrations/"]

[[tool.mypy.overrides]]
module = ["xmltodict", "weasyprint", "networkx", "yaml"]
ignore_missing_imports = true
