name: cms
description: "CMS detection and vulnerability scanning"
scan_timeout: 1200
plugin_timeout: 400
plugin_groups:
  - name: fingerprint
    plugins: [whatweb]
    concurrency: sequential
  - name: cms_scanners
    plugins: [wpscan]
    concurrency: thread_pool
    max_workers: 2
plugins:
  whatweb:
    extra_args: []
  wpscan:
    extra_args: []
conditionals:
  wpscan:
    requires_service: http
