- id: "opp-sqli-001"
  name: "SQL Injection Assessment"
  domain: "WEB"
  base_score: 8.5
  conditions:
    - field: "service"
      operator: "IN"
      value: ["http", "https"]
    - field: "port"
      operator: "IN"
      value: [80, 443, 8080, 8443, 8000]
  required_findings: ["SERVICE", "PORT"]
  score_formula: "base * confidence * severity_weight"
  recommended_modules: ["SQLiModule", "DirectoryEnumerationModule", "HTTPHeadersModule"]

